# Runs on every push and pull request, with no paths: filter. This guard parses nine files
# (ui_configuration.c and .h, ui_menu.c, ui_menu_structure.c, audio_driver.h, radio_management.h,
# audio_agc.h, audio_filter.h and the Makefile), and gen_config_upgrade.py also walks the tree and
# opens headers by computed name, so a hand kept include list is always a subset of the truth. A
# previous version of this filter omitted ui_menu_structure.c and audio_filter.h, which meant that
# editing the menu table, the very place a duplicate or missing EEPROM id shows up, ran neither
# check. Both jobs together take about four seconds, so the filter buys nothing either.
name: Host checks, configuration storage and digital modes

on:
  push:
    branches: [active-devel]
  pull_request:

jobs:
  config-upgrade-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run the upgrade check
        working-directory: mchf-eclipse
        run: make config-upgrade-check

      - name: Fail if the committed harness is stale
        run: |
          git diff --exit-code -- mchf-eclipse/support/config_upgrade/config_upgrade.c || {
            echo "::error::config_upgrade.c does not match the firmware sources, run make config-upgrade-check and commit the regenerated file"
            exit 1
          }

  # The RTTY modem of drivers/audio/rtty.c is compiled for the host and looped back on itself, and
  # a synthetic HF weather fax broadcast is decoded by the reference demodulator. Thresholds, not
  # just a build: see support/digi/README.md.
  digi-bench:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # the bench measures the filters, this rebuilds them from the design their comments document:
      # a coefficient set that drifted off its label still decodes a clean loopback, because the ATC
      # decides from the mark channel. See support/digi/design_rtty_filters.py.
      - name: Check the RTTY filter coefficients against their design
        working-directory: mchf-eclipse
        run: python3 support/digi/design_rtty_filters.py

      - name: Run the digital mode host bench
        working-directory: mchf-eclipse
        run: make digi-bench

      # the shift and SNR matrix is the only demodulator regression table there is: 45.45 and 50 Bd
      # across the six shifts, down to 7 dB SNR and with fading. The bench run above loops back once;
      # this one fails above the per case character error rate limit.
      - name: Run the RTTY shift and SNR character error rate matrix
        working-directory: mchf-eclipse
        run: make -C support/digi rtty
