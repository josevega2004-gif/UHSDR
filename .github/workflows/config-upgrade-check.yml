# Runs on every push and pull request, with no paths: filter. This guard parses nine files
# (ui_configuration.c and .h, ui_menu.c, ui_menu_structure.c, audio_driver.h, radio_management.h,
# audio_agc.h, audio_filter.h and the Makefile), and gen_config_upgrade.py also walks the tree and
# opens headers by computed name, so a hand kept include list is always a subset of the truth. A
# previous version of this filter omitted ui_menu_structure.c and audio_filter.h, which meant that
# editing the menu table, the very place a duplicate or missing EEPROM id shows up, ran neither
# check. Both jobs together take about fifteen seconds, so the filter buys nothing either.
name: Host checks, configuration storage and digital modes

on:
  push:
    branches: [active-devel]
  pull_request:

jobs:
  config-upgrade-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run the upgrade check
        working-directory: mchf-eclipse
        run: make config-upgrade-check

      - name: Fail if the committed harness is stale
        run: |
          git diff --exit-code -- mchf-eclipse/support/config_upgrade/config_upgrade.c || {
            echo "::error::config_upgrade.c does not match the firmware sources, run make config-upgrade-check and commit the regenerated file"
            exit 1
          }

      # A record that lags the table only prints a notice in the check above, so a word that became
      # visible or a value that was renamed without the record being refreshed keeps this job green
      # while the committed map no longer describes what the firmware stores. Rewriting the record
      # of the current marker from the table and looking at what that changed is the same rule as
      # for the harness file above, so both halves live in one step: the rewrite is the only thing
      # that can tell a stale record, and it is also the one thing that fails on a layout change it
      # must not repair (a word that changed hands, or a marker LAYOUT_HISTORY does not know). Those
      # two outcomes are a stale record and a real layout change, so the step says which happened
      # instead of leaving make's exit code to speak for the layout.
      - name: Fail if a recorded layout map lags the table
        working-directory: mchf-eclipse
        run: |
          make layout-record || {
            echo "::error::a recorded layout map cannot be refreshed from the table: the recorder refused a word that changed hands or disappeared, or CONFIG_LAYOUT_VERSION_MAGIC is not in LAYOUT_HISTORY. That is a layout change and needs a new marker with a migration, not a rewritten map."
            exit 1
          }
          changed="$(git status --porcelain -- ':(glob)support/config_upgrade/layout-*.map')"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::a recorded layout map does not match the table, run make layout-record and commit the result with the change that made the record stale"
            exit 1
          fi

      # The guard is only worth its lines if it still fails on the changes it exists for: a value
      # moving to another word, a value that was only renamed, an offset of the previous layout
      # translation moving, a marker bumped without a map change, a parser that gains or loses a
      # stored word, a record that does not parse, two rows on one id or in one variable, a menu
      # wider than the storage, and the whole marker bump. It applies each change to a temporary
      # copy of the files the checks read, so a failure here cannot leave the checkout mutated.
      - name: Run the layout guard through the changes it exists to catch
        working-directory: mchf-eclipse
        run: make layout-guard-selftest

  # The RTTY modem of drivers/audio/rtty.c is compiled for the host and looped back on itself, and
  # a synthetic HF weather fax broadcast is decoded by the reference demodulator. Thresholds, not
  # just a build: see support/digi/README.md.
  digi-bench:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # the bench measures the filters, this rebuilds them from the design their comments document:
      # a coefficient set that drifted off its label still decodes a clean loopback, because the ATC
      # decides from the mark channel. See support/digi/design_rtty_filters.py.
      - name: Check the RTTY filter coefficients against their design
        working-directory: mchf-eclipse
        run: python3 support/digi/design_rtty_filters.py

      - name: Run the digital mode host bench
        working-directory: mchf-eclipse
        run: make digi-bench

      # the shift and SNR matrix is the only demodulator regression table there is: 45.45 and 50 Bd
      # across the six shifts, down to 7 dB SNR and with fading. The bench run above loops back once;
      # this one fails above the per case character error rate limit.
      - name: Run the RTTY shift and SNR character error rate matrix
        working-directory: mchf-eclipse
        run: make -C support/digi rtty

      # the matrix above sends 48 characters, where one wrong character is 2.1 %: 0.0 % there only
      # means "under 2.1 %". This sends the same text eight times through the same cases, so a clean
      # row is under three tenths of a percent and a partly wrong one reports a rate worth reading.
      - name: Run the RTTY matrix with a long message
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-long

      # a received signal can be several ppm off, and the modem has no AFC: the pair simply sits
      # away from the fixed 915 Hz / 915 + shift filters. This walks it off in Hz, prints the ppm
      # each offset means on 3.5/14/28/50 MHz, and fails if the asserted window has shrunk.
      # the shift setting moves the receiver's space filter and nothing else here: the signal stays at
      # 170 Hz shift. A clean signal decodes whatever the setting is (the mark channel carries the
      # bits), so the guard takes the mark tone 30 dB down, and then only 170/200 Hz decode.
      - name: Run the RTTY shift setting curve
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-shift

      - name: Run the RTTY tuning error sweep
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-tune

      # the one case that is not synthetic: a real DWD RTTY transmission recorded off the NA5B WebSDR,
      # kept as a committed 13.7 s fixture. It fails if the decoder's output for real audio moves, so
      # a modem change that no synthetic row notices still has to be explained.
      - name: Decode the recorded DWD on air fixture
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-ddk2
