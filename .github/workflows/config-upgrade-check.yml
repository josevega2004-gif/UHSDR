# Runs on every push and pull request, with no paths: filter. This guard parses nine files
# (ui_configuration.c and .h, ui_menu.c, ui_menu_structure.c, audio_driver.h, radio_management.h,
# audio_agc.h, audio_filter.h and the Makefile), and gen_config_upgrade.py also walks the tree and
# opens headers by computed name, so a hand kept include list is always a subset of the truth. A
# previous version of this filter omitted ui_menu_structure.c and audio_filter.h, which meant that
# editing the menu table, the very place a duplicate or missing EEPROM id shows up, ran neither
# check. Both jobs together take about fifteen seconds, so the filter buys nothing either.
name: Host checks, configuration storage and digital modes

on:
  push:
    branches: [active-devel]
  pull_request:

jobs:
  config-upgrade-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run the upgrade check
        working-directory: mchf-eclipse
        run: make config-upgrade-check

      - name: Fail if the committed harness is stale
        run: |
          git diff --exit-code -- mchf-eclipse/support/config_upgrade/config_upgrade.c || {
            echo "::error::config_upgrade.c does not match the firmware sources, run make config-upgrade-check and commit the regenerated file"
            exit 1
          }

      # A record that lags the table only prints a notice in the check above, so a word that became
      # visible or a value that was renamed without the record being refreshed keeps this job green
      # while the committed map no longer describes what the firmware stores. Rewriting the record
      # of the current marker from the table and looking at what that changed is the same rule as
      # for the harness file above, so both halves live in one step: the rewrite is the only thing
      # that can tell a stale record, and it is also the one thing that fails on a layout change it
      # must not repair (a word that changed hands, or a marker LAYOUT_HISTORY does not know). Those
      # two outcomes are a stale record and a real layout change, so the step says which happened
      # instead of leaving make's exit code to speak for the layout.
      - name: Fail if a recorded layout map lags the table
        working-directory: mchf-eclipse
        run: |
          make layout-record || {
            echo "::error::a recorded layout map cannot be refreshed from the table: the recorder refused a word that changed hands or disappeared, or CONFIG_LAYOUT_VERSION_MAGIC is not in LAYOUT_HISTORY. That is a layout change and needs a new marker with a migration, not a rewritten map."
            exit 1
          }
          changed="$(git status --porcelain -- ':(glob)support/config_upgrade/layout-*.map')"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::a recorded layout map does not match the table, run make layout-record and commit the result with the change that made the record stale"
            exit 1
          fi

      # The guard is only worth its lines if it still fails on the changes it exists for: a value
      # moving to another word, a value that was only renamed, an offset of the previous layout
      # translation moving, a marker bumped without a map change, a parser that gains or loses a
      # stored word, a record that does not parse, two rows on one id or in one variable, a menu
      # wider than the storage, and the whole marker bump. It applies each change to a temporary
      # copy of the files the checks read, so a failure here cannot leave the checkout mutated.
      - name: Run the layout guard through the changes it exists to catch
        working-directory: mchf-eclipse
        run: make layout-guard-selftest

  # The RTTY modem of drivers/audio/rtty.c is compiled for the host and looped back on itself, and
  # a synthetic HF weather fax broadcast is decoded by the reference demodulator. Thresholds, not
  # just a build: see support/digi/README.md.
  digi-bench:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # the bench measures the filters, this rebuilds them from the design their comments document:
      # a coefficient set that drifted off its label still decodes a clean loopback, because the ATC
      # decides from the mark channel. See support/digi/design_rtty_filters.py.
      - name: Check the RTTY filter coefficients against their design
        working-directory: mchf-eclipse
        run: python3 support/digi/design_rtty_filters.py

      - name: Run the digital mode host bench
        working-directory: mchf-eclipse
        run: make digi-bench

      # the shift and SNR matrix is the only demodulator regression table there is: 45.45 and 50 Bd
      # across the six shifts, down to 7 dB SNR and with fading. The bench run above loops back once;
      # this one fails above the per case character error rate limit.
      - name: Run the RTTY shift and SNR character error rate matrix
        working-directory: mchf-eclipse
        run: make -C support/digi rtty

      # A build with one receiver assumption deliberately broken: the receiver is told the other
      # symbol speed. The target first has to see the real build pass the same table, then the broken
      # build fail it on the clean 170 row and run to the end of the table, so a crash or an unrelated
      # row cannot stand in for the receiver fault this control exists to catch.
      - name: Check the bench fails a broken receiver
        working-directory: mchf-eclipse
        run: make -C support/digi break-rx

      # the matrix above sends 48 characters, where one wrong character is 2.1 %: 0.0 % there only
      # means "under 2.1 %". This sends the same text eight times through the same cases, so a clean
      # row is under three tenths of a percent and a partly wrong one reports a rate worth reading.
      - name: Run the RTTY matrix with a long message
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-long

      # a received signal can be several ppm off, and the modem has no AFC: the pair simply sits
      # away from the fixed 915 Hz / 915 + shift filters. This walks it off in Hz, prints the ppm
      # each offset means on 3.5/14/28/50 MHz, and fails if the asserted window has shrunk.
      # the shift setting moves the receiver's space filter and nothing else here: the signal stays at
      # 170 Hz shift. A clean signal decodes whatever the setting is (the mark channel carries the
      # bits), so the guard takes the mark tone 30 dB down, and then only 170/200 Hz decode.
      - name: Run the RTTY shift setting curve
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-shift

      - name: Run the RTTY tuning error sweep
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-tune

      # the one case that is not synthetic: a real DWD RTTY transmission recorded off the NA5B WebSDR,
      # kept as a committed 13.7 s fixture. It fails if the decoder's output for real audio moves, so
      # a modem change that no synthetic row notices still has to be explained.
      - name: Decode the recorded DWD on air fixture
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-ddk2

      # the same take, one row per character: the junction the record names, so a decoder change
      # that moved the 2.7 % somewhere else could not pass as the same result
      - name: Check the pinned characters in the DWD take
        working-directory: mchf-eclipse
        run: make -C support/digi fixture-align

      # a second path: the sweep has to stay under 5 % a cell, and the 18 ms case has to keep costing
      # the message - the echo failure is pinned from below, so a modem that became immune to it
      # would fail here
      - name: Run the two path RTTY sweep
        working-directory: mchf-eclipse
        run: make -C support/digi rtty-multipath

      # the modulator's own keying through the receiver's gate: every interval between tone changes
      # has to sit on the half bit lattice, which a receiver loopback cannot see
      - name: Check the RTTY transmitter keying
        working-directory: mchf-eclipse
        run: make -C support/digi tx-check

      # The MFSK16 and Olivia sections quote a 2.5 kHz floor that is measured, not converted. This
      # reruns the documented points (twelve noise seeds each) and fails when a median draw or the
      # range of a point leaves the window the section quotes, so the numbers are guarded instead of
      # being a README claim nobody re-measures. The full step curve is `make -C support/digi
      # floors-2k5`, which this job does not run.
      - name: Check the shaped 2.5 kHz floors against the readings the README documents
        working-directory: mchf-eclipse
        run: make -C support/digi floors-2k5-check

      # NAVTEX is the first mode here that is not the radio's: a reference SITOR-B modem, graded on
      # the two mechanisms the mode is built from. The table has rows that have to fail as well as
      # rows that have to pass - a burst over both copies of a block loses it, and a tuning error past
      # half the shift inverts every word - so a receiver that stopped detecting and started inventing
      # text would not read as an improvement.
      - name: Run the NAVTEX / SITOR-B reference modem
        working-directory: mchf-eclipse
        run: make -C support/digi navtex

      # The same takes through the streaming receiver that is written to fit in the radio, and graded
      # on two numbers: the characters it printed that were not what was sent, and the share of the
      # message it never printed because it was still finding the clock. The first is a defect and is
      # pinned at zero; the second is the price of streaming and is pinned as a ceiling. The rows
      # where the bit rate is not 100 Bd are the two known failures, kept in CI as ceilings on damage
      # rather than as results, because a receiver that starts printing confident garbage across a
      # drifted clock is exactly the regression this step exists to catch.
      - name: Run the streaming SITOR-B demodulator the radio would compile
        working-directory: mchf-eclipse
        run: make -C support/digi sitor-stream

      # The same takes, through the file a firmware build would compile: samples one at a time, pixel
      # clock searched rather than assumed.  Graded against the reference on identical audio, so the
      # column that CI watches is the difference between the two.  On the rows where the transmitter's
      # clock is a whole number of grid steps away the streaming receiver is much better (3.5% of pixels
      # and 30 of 30 glyph cells exact, against 36.0% for the reference, which samples at a fixed
      # nominal period); on the exact-nominal row it is worse, because 97.959 samples does not sit on the
      # grid and the residual slip shears the raster.  Both are pinned, so a step that trades one for the
      # other shows up as a failure here rather than as a surprise on air.
      - name: Run the streaming Hellschreiber receiver the radio would compile
        working-directory: mchf-eclipse
        run: make -C support/digi hell-stream

      # Hellschreiber has no alphabet, so this step grades a picture: exact glyph cells and the share
      # of pixels wrong, with the paper position free and a pixel clock error that has to fail.
      - name: Run the Hellschreiber reference modem
        working-directory: mchf-eclipse
        run: make -C support/digi hell

      # The two tone-set modes are the same ladder of cases, so the steps check the tone grid and
      # the coding separately: MFSK16's interleaver, Olivia's pair redundancy.
      - name: Run the MFSK16 reference modem
        working-directory: mchf-eclipse
        run: make -C support/digi mfsk16

      - name: Run the Olivia reference modem
        working-directory: mchf-eclipse
        run: make -C support/digi olivia

      # Every step above hands a decoder a buffer that starts on a symbol boundary, which no
      # recording does. This one writes each mode's own take with a 0.75 s lead into a WAV, loads it
      # back through the file reader, trims it by its own level, searches one symbol for the start
      # and decodes it; Hell's PGM is read back and compared with the picture the generator drew, so
      # a misplaced or malformed raster fails. The four recording verbs were only ever run by hand,
      # which is the gap that let rtty-multipath fail unnoticed.
      - name: Run the recording paths through a WAV with a lead
        working-directory: mchf-eclipse
        run: make -C support/digi record-check

      # The gate in front of the -wav verbs is a decision, not a decoder, so it gets its own ladder:
      # each mode's takes have to pass it with margin, the controls (silence, noise, one tone, band
      # noise) have to be refused or passed through as "nothing", and no mode may be able to claim
      # another's signal. It calls no modem, for the same reason capture-check does not.
      - name: Run the mode-identification gate
        working-directory: mchf-eclipse
        run: ./support/digi/digi_bench gate-check

      # The two halves of the capture path grade themselves, so the piece that decides whether a take
      # is worth pinning is checked too.  The decoder: a stream built element by element in the script
      # has to pass the framing walk with the counts it was built from and stay recordable to the rules
      # in front of the decoder, a stream of blocks that vary by one code has to stay recordable, and
      # ten streams built to break one rule each - random bytes among them - have to be refused with a
      # nonzero exit and no WAV.  The refusals alone would pass a check that rejected every stream,
      # which is why the recordable cases run beside them, and the two accounting checks that sit
      # after the decoder loads are graded against a recorder's answer - the right one, a take
      # recorded at 8000 Hz instead of the stream's own rate, one short and one over - because a rule
      # with no row beside it is a rule nobody knows is load bearing.  The collector: its tune request
      # (the dial in kHz with the band covering it) and its band table, read from a fixture rather
      # than a receiver, with the dials in the receiver's gaps and a --band outside the table both
      # refused, an unreadable table falling back to no band rather than to a shifted index, what a
      # part records about the ask, and the fetch that reads the table refusing an encoded, a
      # transfer-encoded, an over-long or a truncated body.  The WebSDR client decode_oracle.js loads
      # is not committed (its licence allows it only to be served by the receiver; see the licence
      # note in support/digi/README.md), so these steps grade the framing walk, the rules in front of
      # it and the transport maths, not the decode.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the capture path's own self-tests (decoder framing, refusals, band maths)
        working-directory: mchf-eclipse
        run: make -C support/digi oracle-check

      # The gate itself, on the take this tree pins.  These two need no client and no network: one
      # measures a recorded WAV for a pair, a bit clock and continuity, and the other checks the
      # fixture it measures is still the fixture whose characters are quoted in the README.  Neither
      # ran in CI before, which is how a take that was one hum arrived with a CER in front of people.
      - name: Check the capture gate against the pinned take
        working-directory: mchf-eclipse
        run: make -C support/digi capture-check fixture-check

      # USE_CONVOLUTION is an RX filter that no shipping configuration builds, so nothing but this
      # step ever asks what its filter is worth.  It compiles the shipped module as text, hands it a
      # complex signal, and compares it with a plain time-domain complex FIR over the same taps - an
      # arrangement with no FFT in it, which is how the two bugs it reports were found (the port did
      # the forward FFT in place and then slid fftin into itself as the overlap history, and it kept
      # the wrong half of the inverse transform, which cost 132 dB of sideband separation) - and then
      # measures both this filter and the 199-tap Hilbert pair the receiver runs today with single
      # tones, counting the arithmetic each bills per sample.  It needs no radio and no toolchain.
      - name: Measure the convolution RX filter against the SSB stage in use
        working-directory: mchf-eclipse
        run: make -C support/digi convolution-check

      # The radio has never been able to write a file: the only code that reads a thumb drive is in the
      # bootloader, and it does not stay resident.  drivers/fs/fat32.c is the writer, and it is graded
      # by implementations that are not its own - mkfs.vfat makes the volume, fsck.vfat inspects what
      # fat32.c did to it, and where the machine allows it the kernel's vfat driver reads the bytes back
      # through a loop mount, which is the path a stick takes when it leaves the radio and meets a PC.
      # Two real bugs came out of that: sectors-per-FAT was parsed but never stored, so writing both FAT
      # copies wrote the same sector twice; and the FSINFO patch was applied to whichever FAT sector the
      # free-cluster walk had last loaded, so the free count was never updated.  Neither one shows up if
      # you only ask the writer to read its own output.
      - name: Write a file into a FAT32 volume and have dosfstools judge it
        working-directory: mchf-eclipse
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools
          ./support/fs/run-fs-check.sh
