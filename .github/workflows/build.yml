name: Build firmware

on:
  push:
    branches: [active-devel]
    tags: ["*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fw-h7
            dir: fw-h7
            target: all
            buildfor: "H7"
            trx_id: i40h7
            trx_name: OVI40H7
            configflags: "-DUI_BRD_OVI40 -DRF_BRD_MCHF -DRF_BRD_OVI40"
          - name: bl-h7
            dir: bl-h7
            target: bootloader
            buildfor: "H7"
            trx_id: i40h7
            trx_name: OVI40H7
            configflags: "-DUI_BRD_OVI40"
          - name: fw-f7
            dir: fw-f7
            target: all
            buildfor: "F7"
            trx_id: ovi40
            trx_name: OVI40
            configflags: "-DUI_BRD_OVI40 -DRF_BRD_MCHF -DRF_BRD_OVI40"
          - name: bl-f7
            dir: bl-f7
            target: bootloader
            buildfor: "F7"
            trx_id: ovi40
            trx_name: OVI40
            configflags: "-DUI_BRD_OVI40"
          - name: fw-f7-lapwing
            dir: fw-f7-lapwing
            target: all
            buildfor: "F7"
            trx_id: lapf7
            trx_name: LAPWING
            configflags: "-DUI_BRD_OVI40 -DRF_BRD_LAPWING"
          - name: fw-f4
            dir: fw-f4
            target: all
            buildfor: ""
            trx_id: ""
            trx_name: ""
            configflags: "-DUI_BRD_MCHF -DRF_BRD_MCHF"
          - name: bl-f4
            dir: bl-f4
            target: bootloader
            buildfor: ""
            trx_id: ""
            trx_name: ""
            configflags: "-DUI_BRD_MCHF"
          - name: fw-f4-ili9486-480
            dir: fw-f4-ili9486-480
            target: all
            buildfor: ""
            trx_id: ""
            trx_name: ""
            configflags: "-DUI_BRD_MCHF -DRF_BRD_MCHF -DEXTERNAL_USE_GFX_CONFIG -DUSE_DISP_480_320 -DUSE_GFX_ILI9486"
          - name: fw-f4-small
            dir: fw-f4-small
            target: all
            buildfor: ""
            trx_id: ""
            trx_name: ""
            configflags: "-DUI_BRD_MCHF -DRF_BRD_MCHF -DIS_SMALL_BUILD"

    steps:
      - uses: actions/checkout@v4

      - name: Install 32 bit support libraries
        run: sudo apt-get update && sudo apt-get install -y libc6-i386

      - name: Cache the ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-10-2020-q4-major
          key: gcc-arm-none-eabi-10-2020-q4-major-linux

      - name: Download the ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sL https://developer.arm.com/-/media/Files/downloads/gnu-rm/10-2020q4/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2 \
            | tar xj -C $HOME

      - name: Build ${{ matrix.name }}
        working-directory: mchf-eclipse
        run: |
          mkdir -p build/${{ matrix.dir }}
          cd build/${{ matrix.dir }}
          EXTRA=""
          [ -n "${{ matrix.buildfor }}" ] && EXTRA="$EXTRA BUILDFOR=${{ matrix.buildfor }}"
          [ -n "${{ matrix.trx_id }}" ] && EXTRA="$EXTRA TRX_ID=${{ matrix.trx_id }}"
          [ -n "${{ matrix.trx_name }}" ] && EXTRA="$EXTRA TRX_NAME=${{ matrix.trx_name }}"
          make -j2 -f ../../Makefile ROOTLOC=../.. \
            OPT_GCC_ARM=$HOME/gcc-arm-none-eabi-10-2020-q4-major \
            CONFIGFLAGS="${{ matrix.configflags }}" $EXTRA ${{ matrix.target }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            mchf-eclipse/build/${{ matrix.dir }}/*.bin
            mchf-eclipse/build/${{ matrix.dir }}/*.dfu

  # The matrix above varies the board - which UI, which RF board, which MCU - and never varies the
  # audio and debug options that hardware/uhsdr_board_config.h and hardware/uhsdr_board.h leave
  # commented out.  Those lines are claims as well: "uncomment this and the mode comes back".  Two of
  # them had not been true for years, because the only builds that ever ran had the options off.  This
  # job compiles every translation unit of the mcHF configuration once per switched-off option and
  # compares the failures with mchf-eclipse/support/build_config_known_breakage.txt, so a mode that
  # breaks is named in the commit that broke it and a mode that is repaired loses its manifest line.
  # -fsyntax-only throughout, which is what keeps it to minutes instead of a second full build.
  build-config-check:
    name: Build options that are switched off
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache the ARM toolchain
        id: cache-toolchain-options
        uses: actions/cache@v4
        with:
          path: ~/gcc-arm-none-eabi-10-2020-q4-major
          key: gcc-arm-none-eabi-10-2020-q4-major-linux

      - name: Download the ARM toolchain
        if: steps.cache-toolchain-options.outputs.cache-hit != 'true'
        run: |
          curl -sL https://developer.arm.com/-/media/Files/downloads/gnu-rm/10-2020q4/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2 \
            | tar xj -C $HOME

      # the script takes the command lines from `make -n` unchanged, so the compiler has to be
      # reachable by name the way the build job reaches it by path
      - name: Put the toolchain on PATH
        run: echo "$HOME/gcc-arm-none-eabi-10-2020-q4-major/bin" >> "$GITHUB_PATH"

      - name: Check the switched-off build options
        working-directory: mchf-eclipse
        run: make build-config-check

  release:
    # tag builds only, mirrors the old Travis deploy stage
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      # the default workflow token is read only, creating a release needs write access
      contents: write
    steps:
      - uses: actions/checkout@v4

      # keep one directory per artifact, several variants build a binary of the same name
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir -p release-files
          for d in artifacts/*/; do
            variant=$(basename "$d")
            case "$variant" in
              fw-f4|fw-f7|fw-h7|bl-f4|bl-f7|bl-h7)
                suffix=""
                ;;
              *)  # the small, the ili9486 and the lapwing builds are named after the default
                  # transceiver id as well, so they keep the variant in their name
                  short=${variant#fw-}
                  short=${short#f4-}
                  short=${short#f7-}
                  suffix="-$short"
                  ;;
            esac
            for f in "$d"*.bin "$d"*.dfu; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              cp "$f" "release-files/${base%.*}$suffix.${base##*.}"
            done
          done
          echo "release files:"
          ls -l release-files

      - name: Build the documentation
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          make -C mchf-eclipse docs
          tar -czf docs.tar.gz -C . docs

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*.bin
            release-files/*.dfu
            docs.tar.gz
